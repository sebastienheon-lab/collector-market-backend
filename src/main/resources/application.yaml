server:
  # M7 graceful shutdown: stop accepting new requests and let in-flight ones finish (up to the
  # spring.lifecycle timeout below) instead of killing the JVM immediately.
  shutdown: graceful

spring:
  profiles:
    include:
      - ${SPRING_ENV:local}
      - credentials
  application:
    name: collector-market-backend

  # M7 graceful shutdown: let the scheduler finish the in-flight scheduled job (the poller checks
  # for shutdown on each card boundary, see Poller) before the JVM exits.
  lifecycle:
    timeout-per-shutdown-phase: 30s
  task:
    scheduling:
      shutdown:
        await-termination: true
        await-termination-period: 30s

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns schema; JPA only validates
    properties:
      hibernate:
        format_sql: true
    open-in-view: false    # off by default in prod-shape apps

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# §5.1.1 / OQ-1: eBay Browse API. client-id/client-secret come from the gitignored
# credentials profile (local) or env vars EBAY_CLIENT_ID/EBAY_CLIENT_SECRET (staging/prod);
# oauth-token-url/api-base-url are environment-specific (see application-local.yml for the
# sandbox endpoints, application-staging/prod for production endpoints).
ebay:
  daily-call-limit: 5000 # free-tier default, confirmed via eBay developer docs (M3)
  # M7: eBay health indicator marks the integration DEGRADED after this many hours with no
  # successful call (measured from app start until the first success). Cached-state only - the
  # indicator never makes a live call, so frequent health polling can't burn the daily quota.
  health:
    stale-after-hours: 6
  connect-timeout-ms: 5000
  response-timeout-ms: 10000
  retry:
    max-attempts: 3
    min-backoff-ms: 500
    max-backoff-ms: 8000
  category:
    # "Sports Trading Card Singles" - leaf category under 212 (Sports Trading Cards) / 64482
    # (Sports Mem, Cards & Fan Shop). Verified against live eBay category browse pages (M3).
    trading-card-singles: "261328"

# §5.4 / OQ-9: retention windows. Deliberately NOT in app_setting - compliance-adjacent,
# belongs in code review rather than a runtime settings screen (see §5.4/§9 for the rationale).
retention:
  listing-observation-days: 7
  price-snapshot-linkback-days: 30

# OQ-4 / M6: the React frontend is a separate origin. Comma-separated list; never wildcard
# (see WebConfig, which rejects "*"). Override per environment via APP_CORS_ALLOWED_ORIGINS.
app:
  cors:
    allowed-origins: http://localhost:5173

# M6 API docs. /v3/api-docs is always on so the frontend repo can pull the contract; the Swagger
# UI is gated off in prod (application-prod.yaml) but left on in dev/staging.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, caches
  endpoint:
    health:
      # Safe default; local/staging override to "always" for component-level visibility.
      show-details: when-authorized
      # M7: the eBay indicator reports DEGRADED (stale, but the app still serves DB reads) as a
      # distinct, less-severe-than-DOWN status that maps to HTTP 200, so a quiet eBay integration
      # never 503s the whole app. DOWN (token refresh failed) still fails hard.
      status:
        order: DOWN,OUT_OF_SERVICE,DEGRADED,UNKNOWN,UP
        http-mapping:
          degraded: 200

# Human-readable console logging by default (local). staging/prod switch to structured JSON
# (logging.structured.format.console: ecs) in their profile files.
logging:
  level:
    root: INFO
    com.collectormarket: DEBUG
    org.hibernate.SQL: DEBUG