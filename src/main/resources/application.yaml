spring:
  profiles:
    include:
      - ${SPRING_ENV:dev}
      - credentials
  application:
    name: collector-market-backend

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns schema; JPA only validates
    properties:
      hibernate:
        format_sql: true
    open-in-view: false    # off by default in prod-shape apps

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# §5.1.1 / OQ-1: eBay Browse API. client-id/client-secret come from the gitignored
# credentials profile; oauth-token-url/api-base-url are environment-specific (see
# application-dev.yml for the sandbox endpoints).
ebay:
  daily-call-limit: 5000 # free-tier default, confirmed via eBay developer docs (M3)
  connect-timeout-ms: 5000
  response-timeout-ms: 10000
  retry:
    max-attempts: 3
    min-backoff-ms: 500
    max-backoff-ms: 8000
  category:
    # "Sports Trading Card Singles" - leaf category under 212 (Sports Trading Cards) / 64482
    # (Sports Mem, Cards & Fan Shop). Verified against live eBay category browse pages (M3).
    trading-card-singles: "261328"

# §5.4 / OQ-9: retention windows. Deliberately NOT in app_setting - compliance-adjacent,
# belongs in code review rather than a runtime settings screen (see §5.4/§9 for the rationale).
retention:
  listing-observation-days: 7
  price-snapshot-linkback-days: 30

# OQ-4 / M6: the React frontend is a separate origin. Comma-separated list; never wildcard
# (see WebConfig, which rejects "*"). Override per environment via APP_CORS_ALLOWED_ORIGINS.
app:
  cors:
    allowed-origins: http://localhost:5173

# M6 API docs. /v3/api-docs is always on so the frontend repo can pull the contract; the Swagger
# UI is gated off in prod (application-prod.yaml) but left on in dev/staging.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.collectormarket: DEBUG
    org.hibernate.SQL: DEBUG