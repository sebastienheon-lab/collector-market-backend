spring:
  profiles:
    include:
      - ${SPRING_ENV:dev}
      - credentials
  application:
    name: collector-market-backend

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns schema; JPA only validates
    properties:
      hibernate:
        format_sql: true
    open-in-view: false    # off by default in prod-shape apps

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.collectormarket: DEBUG
    org.hibernate.SQL: DEBUG