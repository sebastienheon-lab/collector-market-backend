# Card catalog seed - first-pass draft for review (planning.md §10 Phase 1, OQ-2).
# Scope: BASE cards only, top rookies of the 2023-2025 classes, top 4 US sports, one flagship
# product per player. Parallels are intentionally excluded here - they enter the catalog
# organically via unmatched-listing triage (§10) once real listings surface demand for them.
#
# THIS IS A DRAFT. Flagged explicitly for review before commit:
#   - cardNumber is populated only where a real number was confirmed during M4 research
#     (Corbin Carroll #95, Victor Wembanyama #136, C.J. Stroud #339, Connor Bedard #451,
#     Cooper Flagg #201, Travis Hunter #301, Shedeur Sanders #302, Cutter Gauthier #212,
#     Logan Stankoven #244). Every other cardNumber is omitted (null) rather than guessed -
#     verify against official checklists (Beckett/CardboardConnection/Topps) before relying on
#     cardNumber-based matching for these rows.
#   - MLB uses "Topps Chrome" (brand=Topps, setName=Chrome) uniformly for the player's rookie
#     season, not "Bowman Chrome" prospect cards (those predate MLB debut and would carry a
#     different, earlier year) - Bowman Chrome variants can be triaged in later if wanted.
#   - NBA: Panini lost the NBA license as of Oct 2025 (Fanatics/Topps now holds it). 2023 and
#     2024 NBA rookies use Panini Prizm as originally planned; 2025 NBA rookies use 2025-26
#     Topps Basketball instead (brand=Topps) - decided during this session.
#   - NFL 2025 still uses Panini Prizm - it shipped as Panini's final licensed NFL release
#     (Feb 2026) before Fanatics takes over, so the 2025 draft class has a real Prizm checklist.
#   - 2025 rookie-class entries (all sports) are lower-confidence than 2023/2024 - fewer of them
#     are included here for that reason rather than padding the list.
#   - Total lands around ~160 cards, short of the ~225 target - accuracy was prioritized over
#     hitting the round number. Easy to extend once reviewed.
#
# Idempotent upsert key (see CardSeedLoader): playerName + year + brand + setName + cardNumber.

