name: CI

# Runs the full build + test suite on every PR and on pushes to main (M8).
# Tests use Testcontainers (Postgres) via the runner's Docker daemon and WireMock for eBay -
# no external services and no eBay credentials are required. The `live` JUnit group (real eBay
# sandbox calls) is excluded by the Surefire default (pom.xml: excludedGroups=live).
on:
  pull_request:
  push:
    branches: [main]

# A newer commit on the same branch/PR cancels the older, still-running build.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: mvn verify
    runs-on: ubuntu-latest # ships with Docker, which Testcontainers needs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven # cache ~/.m2 keyed on pom.xml

      - name: Build and test
        run: ./mvnw -B --no-transfer-progress verify

      - name: Publish test report
        if: always() # attach results even when the build failed
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.xml'
          if-no-files-found: ignore
